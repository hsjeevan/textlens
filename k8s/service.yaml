# Services for the TextLens stack. Redis is internal (ClusterIP). The API and
# dashboard are LoadBalancer Services: Docker Desktop publishes them on
# localhost (API on 8000, dashboard on 8501), so no port-forward is needed.
---
apiVersion: v1
kind: Service
metadata:
  # This name is the host in the API's REDIS_URL (deployment.yaml).
  name: textlens-redis
  labels:
    app.kubernetes.io/name: textlens-redis
    app.kubernetes.io/part-of: textlens
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: textlens-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: textlens-api
  labels:
    app.kubernetes.io/name: textlens-api
    app.kubernetes.io/part-of: textlens
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: textlens-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: textlens-frontend
  labels:
    app.kubernetes.io/name: textlens-frontend
    app.kubernetes.io/part-of: textlens
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: textlens-frontend
  ports:
    - name: http
      port: 8501
      targetPort: http
